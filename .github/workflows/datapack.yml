name: Test Datapack and Upload Zip Files

on:
  push:
    branches: [ "main", "graphical-actions-pr" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip MF_resourcepack contents
        run: |
          cd MF_resourcepack
          zip -r ../MF_resourcepack.zip .

      - name: Zip MF_datapack contents
        run: |
          cd MF_datapack
          zip -r ../MF_datapack.zip .
        
      - name: Setup Minecraft
        id: minecraft
        uses: ReinIsNOTaDev/setup-minecraft@main
        with:
          version: "26.2"
          
      - uses: actions/setup-java@v3
        with:
          distribution: "microsoft"
          java-version: ${{ fromJson(steps.minecraft.outputs.package).javaVersion.majorVersion }}
  
      - name: Run Server
        timeout-minutes: 6
        run: |
          echo Running Minecraft ${{ steps.minecraft.outputs.version }}.
          cat <<EOF > server.properties
          initial-enabled-packs=vanilla,file/MF_datapack.zip
          EOF
          echo "eula=true" > eula.txt
          cp ./MF_datapack.zip ./world/datapack
          nohup java -jar $MINECRAFT nogui&> server.log &
          sleep 1
          timeout 5m grep -Eq 'Done \([.[:digit:]]*s\)! For help, type "help"|\[main/ERROR\]' <(tail -f server.log) || exit 1

      - name: Upload MF_resourcepack artifact
        uses: actions/upload-artifact@v7
        with:
          path: MF_resourcepack.zip
          archive: false

      - name: Upload MF_datapack artifact
        uses: actions/upload-artifact@v7
        with:
          path: MF_datapack.zip
          archive: false
    
      - name: Upload server logs
        uses: actions/upload-artifact@v7
        with:
          path: server.log
          archive: false
