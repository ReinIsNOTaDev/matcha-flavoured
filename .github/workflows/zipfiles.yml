name: Create Matcha Zip Files

on:
  push:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip MF_resourcepack contents
        run: |
          cd MF_resourcepack
          zip -r ../MF_resourcepack.zip .

      - name: Zip MF_datapack contents
        run: |
          cd MF_datapack
          zip -r ../MF_datapack.zip .

      - name: Upload MF_resourcepack artifact
        uses: actions/upload-artifact@v4
        with:
          name: MF_resourcepack
          path: MF_resourcepack.zip

      - name: Upload MF_datapack artifact
        uses: actions/upload-artifact@v4
        with:
          name: MF_datapack
          path: MF_datapack.zip
